<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmos Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        header { text-align: center; padding: 3rem 1rem 2rem; }
        header h1 { font-size: 2.5rem; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; color: #fff; }
        header p { margin-top: 0.5rem; color: #888; font-size: 0.9rem; letter-spacing: 0.1em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1400px; margin: 0 auto; }
        .card { background: #141414; border-radius: 12px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; border: 1px solid #222; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(255,255,255,0.05); border-color: #333; }
        .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
        .card .info { padding: 1.2rem 1.5rem 1.5rem; }
        .card h2 { font-size: 1rem; font-weight: 500; color: #fff; margin-bottom: 0.3rem; }
        .card .tag { display: inline-block; font-size: 0.7rem; background: #1e1e1e; color: #aaa; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid #333; margin-top: 0.4rem; }
        footer { text-align: center; padding: 3rem 1rem; color: #444; font-size: 0.75rem; letter-spacing: 0.1em; }
    </style>
</head>
<body>
    <header>
        <h1>Kosmos</h1>
        <p>Tools Collection</p>
    </header>
    <main class="grid">
        <article class="card">
            <img src="dual-ended_polishing_machine.jpg" alt="Dual-Ended Polishing Machine" loading="lazy">
            <div class="info">
                <h2>Dual-Ended Polishing Machine</h2>
                <span class="tag">Polishing</span>
            </div>
        </article>
        <article class="card">
            <img src="engraver.jpg" alt="Engraver" loading="lazy">
            <div class="info">
                <h2>Engraver</h2>
                <span class="tag">Engraving</span>
            </div>
        </article>
        <article class="card">
            <img src="hand-crank_metal_rolling_machine.jpg" alt="Hand-Crank Metal Rolling Machine" loading="lazy">
            <div class="info">
                <h2>Hand-Crank Metal Rolling Machine</h2>
                <span class="tag">Metal Rolling</span>
            </div>
        </article>
        <article class="card">
            <img src="metal_melting_casting kit.jpg" alt="Metal Melting &amp; Casting Kit" loading="lazy">
            <div class="info">
                <h2>Metal Melting &amp; Casting Kit</h2>
                <span class="tag">Casting</span>
            </div>
        </article>
        <article class="card">
            <img src="micro_drill_strong-204_2.35_mm.jpg" alt="Micro Drill Strong-204 2.35mm" loading="lazy">
            <div class="info">
                <h2>Micro Drill Strong-204</h2>
                <span class="tag">2.35 mm</span>
            </div>
        </article>
    </main>
    <footer>KOSMOS &copy; 2026</footer>
</body>
</html>
